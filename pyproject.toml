[project]
name = "portland-ground-truth-pilot"
version = "0.1.0"
description = "Asynchronous Human-in-the-Loop physical verification bridge for AI agents in Portland, OR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.0.0,<2.0.0",
    "python-telegram-bot>=21.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "pillow>=11.0.0",
    "langgraph>=1.2.24",
    "langchain-core>=1.8.4",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[tool.uv]
package = false
